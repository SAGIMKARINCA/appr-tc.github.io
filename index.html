<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppRTC | appr.tc</title>
    <meta name="description" content="AppRTC - Sağlık Hizmetleri ve Dijital Hekimlik Çözümleri">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -20%, rgba(59, 130, 246, 0.15), transparent),
                radial-gradient(ellipse 60% 50% at 80% 50%, rgba(139, 92, 246, 0.08), transparent),
                radial-gradient(ellipse 60% 50% at 20% 80%, rgba(16, 185, 129, 0.06), transparent);
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 640px;
            width: 100%;
        }

        .logo {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #737373;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.125rem;
            color: #737373;
            line-height: 1.7;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .link-card {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-decoration: none;
            color: #e5e5e5;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 1.5rem;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.1);
        }

        .link-card svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .arrow {
            transition: transform 0.3s ease;
        }

        .link-card:hover .arrow {
            transform: translateX(4px);
        }

        .contact {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #525252;
        }

        .contact a {
            color: #737373;
            text-decoration: none;
            border-bottom: 1px solid rgba(115, 115, 115, 0.3);
            transition: color 0.2s, border-color 0.2s;
        }

        .contact a:hover {
            color: #a3a3a3;
            border-color: rgba(163, 163, 163, 0.5);
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 1.5rem;
            z-index: 1;
        }

        footer a {
            font-size: 0.75rem;
            color: #404040;
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #737373;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <main class="container">
        <div class="logo">appr.tc</div>

        <h1>AppRTC</h1>

        <p class="subtitle">
            Sağlık hizmetleri, dijital hekimlik ve klinik araştırma çözümleri.
        </p>

        <a href="https://alpercihan.com" class="link-card" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            alpercihan.com
            <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/>
                <path d="m12 5 7 7-7 7"/>
            </svg>
        </a>

        <p class="contact">
            İletişim: <a href="mailto:admin@appr.tc">admin@appr.tc</a>
        </p>
    </main>

    <footer>
        <a href="https://github.com/SAGIMKARINCA/appr-tc.github.io">GitHub</a>
    </footer>
</body>
</html>
